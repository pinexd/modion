# Run by hand: Actions tab -> Release -> Run workflow.
# Packs Modion into a tarball (Linux) and a zip with Electron included (Windows) and opens
# a release for them. With "draft" left on, the release
# is not public until you press Publish on it, so the notes can be written or polished in
# GitHub's release editor first.
#
# If the repository has a secret named CURSEFORGE_KEY, it is placed in the package as
# curseforge.key so the release works with CurseForge out of the box. It is never committed.
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag, for example v0.1.0'
        required: true
      title:
        description: 'Release title (defaults to "Modion <tag>")'
        required: false
      notes:
        description: 'Release notes (Markdown). Leave empty to write them on the draft.'
        required: false
      draft:
        description: 'Create as a draft to review before publishing'
        type: boolean
        default: true
      prerelease:
        description: 'Mark as a pre-release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag }}
      TITLE: ${{ inputs.title }}
      NOTES: ${{ inputs.notes }}
      DRAFT: ${{ inputs.draft }}
      PRERELEASE: ${{ inputs.prerelease }}
      CURSEFORGE_KEY: ${{ secrets.CURSEFORGE_KEY }}
      SIGNING_KEY_B64: ${{ secrets.RELEASE_SIGNING_KEY_B64 }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$'; then
            echo "::error::The tag must look like v0.1.0"; exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::A release named $TAG already exists"; exit 1
          fi

      - name: Check the code
        run: for f in main.js preload.js src/*.js ui/*.js; do node --check "$f"; done

      - name: Pack
        run: |
          dir="modion-${TAG#v}"
          mkdir "$dir"
          cp -r main.js preload.js package.json modion install-desktop-entry.sh README.md src ui assets "$dir/"
          [ -f LICENSE ] && cp LICENSE "$dir/"
          sed -i "s/\"version\": *\"[^\"]*\"/\"version\": \"${TAG#v}\"/" "$dir/package.json"
          if [ -n "$CURSEFORGE_KEY" ]; then
            (umask 077; printf '%s\n' "$CURSEFORGE_KEY" > "$dir/curseforge.key")
            chmod 644 "$dir/curseforge.key"
          else
            echo "::warning::No CURSEFORGE_KEY secret is set; this release ships without a CurseForge key."
          fi
          tar -czf "$dir.tar.gz" "$dir"
          sha256sum "$dir.tar.gz" > "$dir.tar.gz.sha256"
          echo "ASSET=$dir.tar.gz" >> "$GITHUB_ENV"
          echo "APP_DIR=$dir" >> "$GITHUB_ENV"

      # Windows has no system Electron, so its package carries one: Electron's own Windows
      # build (checked against Electron's published checksums) with Modion placed inside.
      - name: Pack for Windows
        env:
          ELECTRON: '44.10.2'
        run: |
          base="https://github.com/electron/electron/releases/download/v$ELECTRON"
          zipname="electron-v$ELECTRON-win32-x64.zip"
          curl -fsSL -o "$zipname" "$base/$zipname"
          curl -fsSL -o SHASUMS256.txt "$base/SHASUMS256.txt"
          grep " \*\?$zipname\$" SHASUMS256.txt | sed 's/ \*/  /' | sha256sum -c -
          win="modion-${TAG#v}-windows-x64"
          mkdir "$win"
          unzip -q "$zipname" -d "$win"
          rm -f "$win/resources/default_app.asar"
          mv "$win/electron.exe" "$win/Modion.exe"
          mkdir "$win/resources/app"
          cp -r "$APP_DIR"/main.js "$APP_DIR"/preload.js "$APP_DIR"/package.json "$APP_DIR"/README.md "$APP_DIR"/src "$APP_DIR"/ui "$APP_DIR"/assets "$win/resources/app/"
          [ -f "$APP_DIR/LICENSE" ] && cp "$APP_DIR/LICENSE" "$win/resources/app/"
          [ -f "$APP_DIR/curseforge.key" ] && cp "$APP_DIR/curseforge.key" "$win/resources/app/"
          zip -qr "$win.zip" "$win"
          sha256sum "$win.zip" > "$win.zip.sha256"
          echo "WIN_ASSET=$win.zip" >> "$GITHUB_ENV"

      - name: Create the release
        run: |
          printf '%s\n' "$NOTES" > notes.md
          args=(--title "${TITLE:-Modion $TAG}" --notes-file notes.md)
          # With a signing key, the tag is signed so GitHub shows the release as Verified.
          # The matching public key must be a *signing* key on the account named below.
          if [ -n "$SIGNING_KEY_B64" ]; then
            KEY="$RUNNER_TEMP/release_signing_key"
            (umask 077; printf '%s' "$SIGNING_KEY_B64" | base64 -d > "$KEY"; echo >> "$KEY")
            git config user.name pine
            git config user.email 105119099+pinexd@users.noreply.github.com
            git config gpg.format ssh
            git config user.signingkey "$KEY"
            git tag -s "$TAG" -m "${TITLE:-Modion $TAG}"
            git push origin "refs/tags/$TAG"
            rm -f "$KEY"
          else
            echo "::warning::No RELEASE_SIGNING_KEY_B64 secret is set; the release tag is unsigned."
            args+=(--target "$GITHUB_SHA")
          fi
          [ "$DRAFT" = "true" ] && args+=(--draft)
          [ "$PRERELEASE" = "true" ] && args+=(--prerelease)
          gh release create "$TAG" "$ASSET" "$ASSET.sha256" "$WIN_ASSET" "$WIN_ASSET.sha256" "${args[@]}"
