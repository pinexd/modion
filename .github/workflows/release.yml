# Run by hand: Actions tab -> Release -> Run workflow.
# Builds the packages (Linux and Windows, each with Electron included) and opens a release
# for them. With "draft" left on, the release
# is not public until you press Publish on it, so the notes can be written or polished in
# GitHub's release editor first.
#
# If the repository has a secret named CURSEFORGE_KEY, it is placed in the packages as
# curseforge.key so the release works with CurseForge out of the box. It is never committed.
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag, for example v0.1.0'
        required: true
      title:
        description: 'Release title (defaults to "Modion <tag>")'
        required: false
      notes:
        description: 'Release notes (Markdown). Leave empty to write them on the draft.'
        required: false
      draft:
        description: 'Create as a draft to review before publishing'
        type: boolean
        default: true
      prerelease:
        description: 'Mark as a pre-release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag }}
      TITLE: ${{ inputs.title }}
      NOTES: ${{ inputs.notes }}
      DRAFT: ${{ inputs.draft }}
      PRERELEASE: ${{ inputs.prerelease }}
      CURSEFORGE_KEY: ${{ secrets.CURSEFORGE_KEY }}
      SIGNING_KEY_B64: ${{ secrets.RELEASE_SIGNING_KEY_B64 }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$'; then
            echo "::error::The tag must look like v0.1.0"; exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::A release named $TAG already exists"; exit 1
          fi

      - name: Check the code
        run: for f in main.js preload.js src/*.js ui/*.js; do node --check "$f"; done

      # One script builds everything (it is the same one that can be run by hand):
      # Modion with Electron for Linux and for Windows, and Modion alone for self-update.
      - name: Build the packages
        run: |
          [ -n "$CURSEFORGE_KEY" ] || echo "::warning::No CURSEFORGE_KEY secret is set; this release ships without a CurseForge key."
          dev/build-release.sh "${TAG#v}" dist
          echo "V=${TAG#v}" >> "$GITHUB_ENV"

      - name: Build the Windows installer
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq nsis
          makensis -V2 -DVERSION="$V" -DSRC="$PWD/dist/modion-$V-windows-x64" -DOUT="$PWD/dist/modion-$V-windows-x64-setup.exe" dev/installer.nsi

      - name: Create the release
        run: |
          printf '%s\n' "$NOTES" > notes.md
          args=(--title "${TITLE:-Modion $TAG}" --notes-file notes.md)
          # With a signing key, the tag is signed so GitHub shows the release as Verified.
          # The matching public key must be a *signing* key on the account named below.
          if [ -n "$SIGNING_KEY_B64" ]; then
            KEY="$RUNNER_TEMP/release_signing_key"
            (umask 077; printf '%s' "$SIGNING_KEY_B64" | base64 -d > "$KEY"; echo >> "$KEY")
            git config user.name pine
            git config user.email 105119099+pinexd@users.noreply.github.com
            git config gpg.format ssh
            git config user.signingkey "$KEY"
            git tag -s "$TAG" -m "${TITLE:-Modion $TAG}"
            git push origin "refs/tags/$TAG"
            rm -f "$KEY"
          else
            echo "::warning::No RELEASE_SIGNING_KEY_B64 secret is set; the release tag is unsigned."
            args+=(--target "$GITHUB_SHA")
          fi
          [ "$DRAFT" = "true" ] && args+=(--draft)
          [ "$PRERELEASE" = "true" ] && args+=(--prerelease)
          cd dist
          # The update package is signed with the same key; Modion only installs an update
          # whose signature matches the public key built into it.
          if [ -n "$SIGNING_KEY_B64" ]; then
            UKEY="$RUNNER_TEMP/update_signing_key"
            (umask 077; printf '%s' "$SIGNING_KEY_B64" | base64 -d > "$UKEY"; echo >> "$UKEY")
            ssh-keygen -q -Y sign -f "$UKEY" -n modion-update "modion-$V-app.zip"
            rm -f "$UKEY"
            extra=("modion-$V-app.zip.sig")
          else
            echo "::warning::No signing key: this release cannot be installed by Modion's self-update."
            extra=()
          fi
          assets=("modion-$V-linux-x64.tar.gz" "modion-$V-windows-x64-setup.exe" "modion-$V-windows-x64.zip" "modion-$V-app.zip")
          sha256sum "${assets[@]}" > SHA256SUMS.txt
          gh release create "$TAG" "${assets[@]}" "${extra[@]}" SHA256SUMS.txt "${args[@]}"
